    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Cyberpunk Color Palette */
            --bg-deep: #050505;
            --bg-secondary: #0a0a0a;
            --neon-purple: #a855f7;
            --neon-blue: #3b82f6;
            --neon-cyan: #06b6d4;
            --neon-pink: #ec4899;
            --neon-green: #10b981;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --card-bg: rgba(15, 15, 15, 0.85);
            --border-glow: rgba(168, 85, 247, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Mesh Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse 80% 80% at 50% -20%, rgba(168, 85, 247, 0.15), transparent),
                radial-gradient(ellipse 60% 60% at 80% 60%, rgba(59, 130, 246, 0.1), transparent),
                radial-gradient(ellipse 70% 70% at 20% 80%, rgba(236, 72, 153, 0.08), transparent);
            z-index: -1;
            animation: meshMove 20s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }

        /* Grid Pattern Overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            padding: 60px 0 40px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue), var(--neon-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 16px;
            text-transform: uppercase;
            animation: glowPulse 3s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.5);
        }

        @keyframes glowPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 48px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 48px;
            position: relative;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-bar {
            width: 100%;
            padding: 18px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .search-bar:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), 0 0 60px rgba(168, 85, 247, 0.2);
            transform: translateY(-2px);
        }

        .search-bar::placeholder {
            color: var(--text-secondary);
        }

        /* Filter Pills */
        .filter-container {
            display: flex;
            gap: 12px;
            margin-bottom: 48px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-pill {
            padding: 10px 24px;
            background: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-pill:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .filter-pill.active {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: white;
            border-color: transparent;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-bottom: 80px;
        }

        /* Holographic Card */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 16px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(59, 130, 246, 0.1));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover {
            border-color: var(--neon-purple);
            box-shadow:
                0 0 40px rgba(168, 85, 247, 0.4),
                0 0 80px rgba(168, 85, 247, 0.2),
                inset 0 0 60px rgba(168, 85, 247, 0.1);
            transform: translateY(-8px) scale(1.02);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            background: rgba(15, 15, 15, 0.6);
            transition: all 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .card-description {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .tag {
            padding: 6px 14px;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-footer {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--neon-purple);
        }

        /* Category Badges */
        .category-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 6px 12px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--neon-purple);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 14px;
            border-top: 1px solid rgba(168, 85, 247, 0.2);
        }

        footer a {
            color: var(--neon-purple);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        footer a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }

            .filter-container {
                gap: 8px;
            }

            .filter-pill {
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        /* No Results Message */
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            font-size: 18px;
            display: none;
        }

        .no-results.show {
            display: block;
        }

        /* Loading Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.6s ease forwards;
        }

        /* Stat Counter */
        .stats {
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .stats span {
            color: var(--neon-purple);
            font-weight: 700;
        }
    </style>
</head>

                aiGrid.innerHTML = '';
                noResults.classList.add('show');
                updateStats(aiTools.length, 0);
                return;
            }

            noResults.classList.remove('show');
            aiGrid.innerHTML = tools.map((tool, index) => `
                <div class="card" style="animation-delay: ${index * 0.05}s">
                    <div class="category-badge">${getCategoryName(tool.category)}</div>
                    <div class="card-header">
                        <div class="card-icon">${tool.icon}</div>
                        <h3 class="card-title">${tool.name}</h3>
                    </div>
                    <p class="card-description">${tool.description}</p>
                    <div class="card-tags">
                        ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-footer">
                        <a href="${tool.link}" target="_blank" class="btn">방문하기</a>
                        ${tool.docs ? `<a href="${tool.docs}" target="_blank" class="btn btn-secondary">문서</a>` : ''}
                    </div>
                </div>
            `).join('');
            updateStats(aiTools.length, tools.length);
        }

        // Get Category Name in Korean
        function getCategoryName(category) {
            const names = {
                'chat': '대화형',
                'image': '이미지',
                'video': '비디오',
                'voice': '음성',
                'productivity': '생산성',
                'search': '검색'
            };
            return names[category] || category;
        }

        // Filter Logic
        function filterTools() {
            let filtered = aiTools;

            // Category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(tool => tool.category === currentFilter);
            }

            // Search filter
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filtered = filtered.filter(tool =>
                    tool.name.toLowerCase().includes(search) ||
                    tool.description.toLowerCase().includes(search) ||
                    tool.tags.some(tag => tag.toLowerCase().includes(search))
                );
            }

            renderCards(filtered);
        }

        // Update Stats
        function updateStats(total, visible) {
            totalCount.textContent = total;
            visibleCount.textContent = visible;
        }

        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            filterTools();
        });

        filterPills.forEach(pill => {
            pill.addEventListener('click', () => {
                // Update active state
                filterPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');

                // Update filter
                currentFilter = pill.dataset.category;
                filterTools();
            });
        });

        // Prevent card click when clicking buttons
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn')) {
                e.stopPropagation();
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
